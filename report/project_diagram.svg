<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 940" font-family="Helvetica, Arial, sans-serif">
  <!-- =============================== STYLES =============================== -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowAI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8e24aa"/>
    </marker>
    <marker id="arrowFPGA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
    <linearGradient id="aiGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e5f5"/>
      <stop offset="100%" stop-color="#e1bee7"/>
    </linearGradient>
    <linearGradient id="fpgaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="ioGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
    <linearGradient id="toolGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #1a1a1a; }
      .subtitle { font-size: 13px; fill: #555; }
      .lbl { font-size: 13px; fill: #111; }
      .lbl-sm { font-size: 11px; fill: #333; }
      .lbl-b { font-size: 13px; font-weight: 700; fill: #111; }
      .section { font-size: 14px; font-weight: 700; fill: #333; }
      .stage { font-size: 14px; font-weight: 700; fill: #0d4f0e; }
      .ai { font-size: 12px; font-weight: 700; fill: #6a1b9a; }
      .arr { stroke: #333; stroke-width: 2; fill: none; }
      .arrAI { stroke: #8e24aa; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
      .arrFPGA { stroke: #2e7d32; stroke-width: 2; fill: none; }
      .box { stroke-width: 1.5; rx: 8; ry: 8; }
    </style>
  </defs>

  <!-- Title -->
  <text x="640" y="34" text-anchor="middle" class="title">5-Stage Pipelined RISC-V (RV32I) CPU on the Basys3 FPGA</text>
  <text x="640" y="54" text-anchor="middle" class="subtitle">End-to-end project overview: inputs, AI-assisted RTL design, FPGA deployment, and outputs</text>

  <!-- ======================= LEGEND ======================= -->
  <g transform="translate(20,70)">
    <rect x="0" y="0" width="260" height="92" rx="8" ry="8" fill="#fafafa" stroke="#ccc"/>
    <text x="10" y="18" class="section">Legend</text>
    <rect x="10" y="26" width="16" height="12" fill="url(#ioGrad)" stroke="#1565c0"/>
    <text x="32" y="36" class="lbl-sm">Input / Output (user side)</text>
    <rect x="10" y="44" width="16" height="12" fill="url(#aiGrad)" stroke="#6a1b9a"/>
    <text x="32" y="54" class="lbl-sm">LLM / AI-assisted step</text>
    <rect x="10" y="62" width="16" height="12" fill="url(#fpgaGrad)" stroke="#2e7d32"/>
    <text x="32" y="72" class="lbl-sm">Runs on the Basys3 FPGA</text>
    <rect x="10" y="80" width="16" height="12" fill="url(#toolGrad)" stroke="#ef6c00"/>
    <text x="32" y="90" class="lbl-sm">Tooling (Vivado / synthesis)</text>
  </g>

  <!-- ============================================================ -->
  <!-- TOP ROW: INPUTS                                               -->
  <!-- ============================================================ -->
  <text x="150" y="195" class="section">INPUTS</text>

  <!-- Input 1: Natural-language specification -->
  <g>
    <rect x="30" y="205" width="240" height="90" class="box" fill="url(#ioGrad)" stroke="#1565c0"/>
    <text x="150" y="228" text-anchor="middle" class="lbl-b">Design Specification</text>
    <text x="150" y="250" text-anchor="middle" class="lbl-sm">Natural-language description of</text>
    <text x="150" y="266" text-anchor="middle" class="lbl-sm">each RV32I module (ALU, regfile,</text>
    <text x="150" y="282" text-anchor="middle" class="lbl-sm">hazard/forwarding unit, etc.)</text>
  </g>

  <!-- Input 2: RISC-V program -->
  <g>
    <rect x="30" y="315" width="240" height="90" class="box" fill="url(#ioGrad)" stroke="#1565c0"/>
    <text x="150" y="338" text-anchor="middle" class="lbl-b">RISC-V Program</text>
    <text x="150" y="360" text-anchor="middle" class="lbl-sm">Assembly / C compiled to RV32I</text>
    <text x="150" y="376" text-anchor="middle" class="lbl-sm">machine code → imem_program.hex</text>
    <text x="150" y="392" text-anchor="middle" class="lbl-sm">(e.g. Fibonacci test program)</text>
  </g>

  <!-- Input 3: User over UART -->
  <g>
    <rect x="30" y="425" width="240" height="80" class="box" fill="url(#ioGrad)" stroke="#1565c0"/>
    <text x="150" y="448" text-anchor="middle" class="lbl-b">Host PC (UART)</text>
    <text x="150" y="470" text-anchor="middle" class="lbl-sm">Streams .hex program into the</text>
    <text x="150" y="486" text-anchor="middle" class="lbl-sm">board at 115200 baud, triggers</text>
    <text x="150" y="502" text-anchor="middle" class="lbl-sm">reset via btnC</text>
  </g>

  <!-- ============================================================ -->
  <!-- MIDDLE COLUMN: LLM-ASSISTED DESIGN + TOOLING                  -->
  <!-- ============================================================ -->
  <text x="640" y="195" class="section" text-anchor="middle">AI-ASSISTED DESIGN &amp; BUILD FLOW</text>

  <!-- Cognichip / LLM box -->
  <g>
    <rect x="370" y="205" width="540" height="120" class="box" fill="url(#aiGrad)" stroke="#6a1b9a" stroke-width="2"/>
    <text x="640" y="228" text-anchor="middle" class="ai">LLM STEP — Cognichip (AI chip-design agent)</text>
    <text x="640" y="250" text-anchor="middle" class="lbl-sm">Takes the natural-language spec for each block and emits SystemVerilog RTL:</text>
    <text x="640" y="268" text-anchor="middle" class="lbl-sm">riscv_alu.sv, register_file.sv, control_unit.sv, branch_unit.sv, forwarding_unit.sv,</text>
    <text x="640" y="284" text-anchor="middle" class="lbl-sm">immediate_generator.sv, load_store_unit.sv, program_counter.sv, pipeline_*.sv, ...</text>
    <text x="640" y="308" text-anchor="middle" class="lbl-sm" font-style="italic">Human-in-the-loop: review, iterate on prompts, integrate modules into riscv_cpu_top.sv</text>
  </g>

  <!-- Verification LLM step -->
  <g>
    <rect x="370" y="345" width="260" height="100" class="box" fill="url(#aiGrad)" stroke="#6a1b9a" stroke-width="2"/>
    <text x="500" y="368" text-anchor="middle" class="ai">LLM STEP — Testbench generation</text>
    <text x="500" y="388" text-anchor="middle" class="lbl-sm">tb_*.sv files (ALU, regfile,</text>
    <text x="500" y="404" text-anchor="middle" class="lbl-sm">control, branch, memory,</text>
    <text x="500" y="420" text-anchor="middle" class="lbl-sm">cpu_top, fibonacci) produced</text>
    <text x="500" y="436" text-anchor="middle" class="lbl-sm">with LLM assistance</text>
  </g>

  <!-- Simulation tool -->
  <g>
    <rect x="650" y="345" width="260" height="100" class="box" fill="url(#toolGrad)" stroke="#ef6c00"/>
    <text x="780" y="368" text-anchor="middle" class="lbl-b">Simulation</text>
    <text x="780" y="388" text-anchor="middle" class="lbl-sm">Icarus / Verilator runs the</text>
    <text x="780" y="404" text-anchor="middle" class="lbl-sm">testbenches → dumpfile.vcd,</text>
    <text x="780" y="420" text-anchor="middle" class="lbl-sm">cpu_sim.out for waveform</text>
    <text x="780" y="436" text-anchor="middle" class="lbl-sm">and correctness checks</text>
  </g>

  <!-- Vivado synth box -->
  <g>
    <rect x="370" y="465" width="540" height="100" class="box" fill="url(#toolGrad)" stroke="#ef6c00"/>
    <text x="640" y="488" text-anchor="middle" class="lbl-b">Vivado Synthesis &amp; Implementation</text>
    <text x="640" y="508" text-anchor="middle" class="lbl-sm">Reads the SystemVerilog sources + basys3_riscv.xdc constraints,</text>
    <text x="640" y="524" text-anchor="middle" class="lbl-sm">synthesizes, places, routes, and emits the FPGA bitstream (.bit).</text>
    <text x="640" y="548" text-anchor="middle" class="lbl-sm" font-style="italic">Driven by scripts/ and vivado/ project files.</text>
  </g>

  <!-- Bitstream -->
  <g>
    <rect x="540" y="585" width="200" height="55" class="box" fill="#fff3e0" stroke="#ef6c00"/>
    <text x="640" y="608" text-anchor="middle" class="lbl-b">Bitstream (.bit)</text>
    <text x="640" y="626" text-anchor="middle" class="lbl-sm">Programmed onto the FPGA</text>
  </g>

  <!-- ============================================================ -->
  <!-- RIGHT COLUMN: OUTPUTS                                         -->
  <!-- ============================================================ -->
  <text x="1130" y="195" class="section" text-anchor="middle">OUTPUTS</text>

  <g>
    <rect x="1010" y="205" width="240" height="90" class="box" fill="url(#ioGrad)" stroke="#1565c0"/>
    <text x="1130" y="228" text-anchor="middle" class="lbl-b">UART Register Dump</text>
    <text x="1130" y="250" text-anchor="middle" class="lbl-sm">Once the program hits its</text>
    <text x="1130" y="266" text-anchor="middle" class="lbl-sm">sentinel, the board streams</text>
    <text x="1130" y="282" text-anchor="middle" class="lbl-sm">"x0=..., x1=..., ..." back over RsTx</text>
  </g>

  <g>
    <rect x="1010" y="315" width="240" height="90" class="box" fill="url(#ioGrad)" stroke="#1565c0"/>
    <text x="1130" y="338" text-anchor="middle" class="lbl-b">On-board LEDs (16)</text>
    <text x="1130" y="360" text-anchor="middle" class="lbl-sm">State / status indicators:</text>
    <text x="1130" y="376" text-anchor="middle" class="lbl-sm">load progress, CPU running,</text>
    <text x="1130" y="392" text-anchor="middle" class="lbl-sm">done, low bits of a register</text>
  </g>

  <g>
    <rect x="1010" y="425" width="240" height="80" class="box" fill="url(#ioGrad)" stroke="#1565c0"/>
    <text x="1130" y="448" text-anchor="middle" class="lbl-b">Simulation Artifacts</text>
    <text x="1130" y="470" text-anchor="middle" class="lbl-sm">.vcd / .fst waveforms and</text>
    <text x="1130" y="486" text-anchor="middle" class="lbl-sm">cpu_sim.out logs for offline</text>
    <text x="1130" y="502" text-anchor="middle" class="lbl-sm">verification of the design</text>
  </g>

  <!-- ============================================================ -->
  <!-- FPGA BLOCK: basys3 top with pipeline                          -->
  <!-- ============================================================ -->
  <g>
    <rect x="30" y="660" width="1220" height="260" class="box" fill="url(#fpgaGrad)" stroke="#2e7d32" stroke-width="2"/>
    <text x="50" y="686" class="stage">Basys3 FPGA Board (Xilinx Artix-7, 100 MHz) — module basys3_riscv_top</text>
    <text x="50" y="704" class="lbl-sm">Connected to the host via USB-UART (RsRx / RsTx) and a physical reset button (btnC). 16 LEDs + 100 MHz clock on board.</text>

    <!-- UART loader -->
    <g>
      <rect x="50" y="720" width="170" height="90" class="box" fill="#ffffff" stroke="#2e7d32"/>
      <text x="135" y="742" text-anchor="middle" class="lbl-b">UART Loader</text>
      <text x="135" y="760" text-anchor="middle" class="lbl-sm">uart_rx.sv / uart_tx.sv</text>
      <text x="135" y="776" text-anchor="middle" class="lbl-sm">receives .hex bytes</text>
      <text x="135" y="792" text-anchor="middle" class="lbl-sm">writes into IMEM</text>
    </g>

    <!-- IMEM -->
    <g>
      <rect x="235" y="720" width="120" height="90" class="box" fill="#ffffff" stroke="#2e7d32"/>
      <text x="295" y="742" text-anchor="middle" class="lbl-b">Instr. ROM</text>
      <text x="295" y="760" text-anchor="middle" class="lbl-sm">instruction_rom.sv</text>
      <text x="295" y="776" text-anchor="middle" class="lbl-sm">(loaded via UART)</text>
    </g>

    <!-- 5-stage pipeline -->
    <g>
      <rect x="370" y="720" width="700" height="160" fill="#ffffff" stroke="#2e7d32" stroke-dasharray="4 3" rx="6" ry="6"/>
      <text x="720" y="740" text-anchor="middle" class="stage">5-Stage Pipeline (riscv_cpu_top.sv)</text>

      <!-- IF -->
      <rect x="385" y="755" width="120" height="100" rx="6" ry="6" fill="#e8f5e9" stroke="#1b5e20"/>
      <text x="445" y="775" text-anchor="middle" class="lbl-b">IF</text>
      <text x="445" y="793" text-anchor="middle" class="lbl-sm">program_counter</text>
      <text x="445" y="809" text-anchor="middle" class="lbl-sm">instruction_rom</text>
      <text x="445" y="843" text-anchor="middle" class="lbl-sm" font-style="italic">IF/ID reg</text>

      <!-- ID -->
      <rect x="520" y="755" width="120" height="100" rx="6" ry="6" fill="#e8f5e9" stroke="#1b5e20"/>
      <text x="580" y="775" text-anchor="middle" class="lbl-b">ID</text>
      <text x="580" y="793" text-anchor="middle" class="lbl-sm">control_unit</text>
      <text x="580" y="809" text-anchor="middle" class="lbl-sm">register_file</text>
      <text x="580" y="825" text-anchor="middle" class="lbl-sm">imm_gen</text>
      <text x="580" y="843" text-anchor="middle" class="lbl-sm" font-style="italic">ID/EX reg</text>

      <!-- EX -->
      <rect x="655" y="755" width="120" height="100" rx="6" ry="6" fill="#e8f5e9" stroke="#1b5e20"/>
      <text x="715" y="775" text-anchor="middle" class="lbl-b">EX</text>
      <text x="715" y="793" text-anchor="middle" class="lbl-sm">riscv_alu</text>
      <text x="715" y="809" text-anchor="middle" class="lbl-sm">branch_unit</text>
      <text x="715" y="825" text-anchor="middle" class="lbl-sm">forwarding</text>
      <text x="715" y="843" text-anchor="middle" class="lbl-sm" font-style="italic">EX/MEM reg</text>

      <!-- MEM -->
      <rect x="790" y="755" width="120" height="100" rx="6" ry="6" fill="#e8f5e9" stroke="#1b5e20"/>
      <text x="850" y="775" text-anchor="middle" class="lbl-b">MEM</text>
      <text x="850" y="793" text-anchor="middle" class="lbl-sm">load_store_unit</text>
      <text x="850" y="809" text-anchor="middle" class="lbl-sm">simple_memory</text>
      <text x="850" y="843" text-anchor="middle" class="lbl-sm" font-style="italic">MEM/WB reg</text>

      <!-- WB -->
      <rect x="925" y="755" width="120" height="100" rx="6" ry="6" fill="#e8f5e9" stroke="#1b5e20"/>
      <text x="985" y="775" text-anchor="middle" class="lbl-b">WB</text>
      <text x="985" y="793" text-anchor="middle" class="lbl-sm">writeback mux</text>
      <text x="985" y="809" text-anchor="middle" class="lbl-sm">→ register_file</text>

      <!-- arrows between stages -->
      <line x1="505" y1="805" x2="520" y2="805" class="arrFPGA" marker-end="url(#arrowFPGA)"/>
      <line x1="640" y1="805" x2="655" y2="805" class="arrFPGA" marker-end="url(#arrowFPGA)"/>
      <line x1="775" y1="805" x2="790" y2="805" class="arrFPGA" marker-end="url(#arrowFPGA)"/>
      <line x1="910" y1="805" x2="925" y2="805" class="arrFPGA" marker-end="url(#arrowFPGA)"/>
    </g>

    <!-- Reg dump / LED driver -->
    <g>
      <rect x="1085" y="720" width="150" height="90" class="box" fill="#ffffff" stroke="#2e7d32"/>
      <text x="1160" y="742" text-anchor="middle" class="lbl-b">Status Logic</text>
      <text x="1160" y="760" text-anchor="middle" class="lbl-sm">LED driver +</text>
      <text x="1160" y="776" text-anchor="middle" class="lbl-sm">register-dump FSM</text>
      <text x="1160" y="792" text-anchor="middle" class="lbl-sm">over uart_tx</text>
    </g>

    <!-- IMEM → IF -->
    <line x1="355" y1="765" x2="385" y2="780" class="arrFPGA" marker-end="url(#arrowFPGA)"/>
    <!-- UART loader → IMEM -->
    <line x1="220" y1="765" x2="235" y2="765" class="arrFPGA" marker-end="url(#arrowFPGA)"/>
    <!-- WB → status logic -->
    <line x1="1045" y1="765" x2="1085" y2="765" class="arrFPGA" marker-end="url(#arrowFPGA)"/>

    <text x="640" y="905" text-anchor="middle" class="lbl-sm" font-style="italic">Clock divider turns the 100 MHz board clock into the slower CPU clock so timing closure is easy while keeping UART at full speed.</text>
  </g>

  <!-- ============================================================ -->
  <!-- CONNECTING ARROWS BETWEEN SECTIONS                            -->
  <!-- ============================================================ -->
  <!-- Spec → Cognichip -->
  <line x1="270" y1="250" x2="370" y2="250" class="arrAI" marker-end="url(#arrowAI)"/>
  <text x="320" y="242" text-anchor="middle" class="lbl-sm" fill="#6a1b9a">prompt</text>

  <!-- Spec → testbench LLM -->
  <line x1="270" y1="285" x2="370" y2="385" class="arrAI" marker-end="url(#arrowAI)"/>

  <!-- Program → Vivado (as memory init) -->
  <line x1="270" y1="360" x2="370" y2="500" class="arr" marker-end="url(#arrow)"/>
  <text x="310" y="436" class="lbl-sm">imem_program.hex</text>

  <!-- Cognichip RTL → Vivado -->
  <line x1="640" y1="325" x2="640" y2="465" class="arr" marker-end="url(#arrow)"/>
  <text x="540" y="341" text-anchor="middle" class="lbl-sm">SystemVerilog RTL</text>

  <!-- Testbenches → Simulation -->
  <line x1="630" y1="395" x2="650" y2="395" class="arr" marker-end="url(#arrow)"/>

  <!-- Simulation result loops back (arrow) -->
  <path d="M 780 345 Q 780 260 750 260" class="arr" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <text x="860" y="341" text-anchor="middle" class="lbl-sm" fill="#555">iterate / fix</text>

  <!-- Vivado → Bitstream -->
  <line x1="640" y1="565" x2="640" y2="585" class="arr" marker-end="url(#arrow)"/>

  <!-- Bitstream → FPGA board -->
  <line x1="640" y1="640" x2="640" y2="660" class="arr" marker-end="url(#arrow)"/>
  <text x="655" y="655" class="lbl-sm">program</text>

  <!-- UART host → FPGA UART loader -->
  <path d="M 270 465 C 320 640 70 640 135 720" class="arr" marker-end="url(#arrow)"/>
  <text x="80" y="640" class="lbl-sm">RsRx (.hex stream)</text>

  <!-- FPGA UART dump → Host / UART output -->
  <path d="M 1160 720 C 1160 640 1250 560 1130 510" class="arr" marker-end="url(#arrow)"/>
  <text x="1195" y="640" class="lbl-sm">RsTx</text>

  <!-- FPGA status logic → LEDs -->
  <path d="M 1235 755 C 1270 600 1250 420 1250 405" class="arr" marker-end="url(#arrow)"/>
  <text x="1260" y="600" class="lbl-sm" text-anchor="end">led[15:0]</text>

  <!-- Simulation → Simulation Artifacts output -->
  <path d="M 910 395 C 1000 395 980 465 1010 465" class="arr" marker-end="url(#arrow)"/>

</svg>
